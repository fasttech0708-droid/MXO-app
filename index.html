<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ургийн Мод Хөтлөх Програм</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- D3.js CDN -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; font-family: 'Roboto', sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    header { text-align: center; margin-bottom: 15px; }
    header h1 { color: #1e3a8a; margin: 0 0 15px 0; font-size: 24px; }
    
    .auth-bar { background-color: #2c3e50; color: white; padding: 10px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .auth-bar button { background-color: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .auth-bar button:hover { background-color: #0369a1; }

    .selected-banner { background-color: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; }

    .controls-panel { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: center; }
    .controls-group { display: flex; align-items: center; gap: 8px; }
    .controls-group label { font-size: 13px; font-weight: bold; color: #475569; }
    
    select, input[type="text"], input[type="number"] { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    
    .btn { padding: 7px 14px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: white; }
    .btn-add { background-color: #22c55e; }
    .btn-edit { background-color: #3b82f6; }
    .btn-delete { background-color: #ef4444; }
    .btn-save { background-color: #0d9488; }
    .btn-pdf { background-color: #a855f7; }
    .btn:hover { opacity: 0.9; }

    #tree-container { width: 100%; height: 600px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #ffffff; overflow: hidden; margin-top: 15px; position: relative; }
    
    .node rect { fill: #ffffff; stroke: #f97316; stroke-width: 2px; rx: 8px; ry: 8px; cursor: pointer; }
    .node text { font-size: 14px; text-anchor: middle; dominant-baseline: middle; fill: #1e293b; }
    .link { fill: none; stroke: #cbd5e1; stroke-width: 2px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Ургийн Мод Хөтлөх Програм</h1>
  </header>

  <!-- Нэвтрэх хэсэг -->
  <div class="auth-bar">
    <span id="user-status">Зочин хэрэглэгч</span>
    <button id="auth-btn" onclick="handleAuth()">🔑 Нэвтрэх / Бүртгүүлэх</button>
  </div>

  <!-- Сонгосон хүн -->
  <div class="selected-banner">
    Сонгосон: <span id="selected-person-name">Өвөг дээдэс (1940)</span>
  </div>

  <!-- Удирдлагын цэс 1 -->
  <div class="controls-panel">
    <div class="controls-group">
      <label>📐 ЗАГВАР:</label>
      <select id="layout-select" onchange="updateTree()">
        <option value="bottom-up">Босоо мод (Доороос дээш)</option>
        <option value="top-down">Босоо мод (Дээрээс доош)</option>
        <option value="radial">Тойрог загвар (Radial)</option>
      </select>
    </div>
    <div class="controls-group">
      <label>Нийт үсэг:</label>
      <input type="range" min="8" max="20" value="10" onchange="updateTree()">
    </div>
  </div>

  <!-- Удирдлагын цэс 2 (Шрифт, чимэглэл) -->
  <div class="controls-panel">
    <div class="controls-group">
      <label>🎨 ЗАГВАРЧЛАЛ:</label>
      <select id="script-type">
        <option value="cyrillic">Кирилл бичиг</option>
      </select>
      <select id="font-family" onchange="updateTree()">
        <option value="Pacifico">Pacifico (Бичмэл)</option>
        <option value="Roboto">Roboto (Энгийн)</option>
      </select>
    </div>
  </div>

  <!-- Үйлдлийн товчлуурууд -->
  <div class="controls-panel">
    <div class="controls-group">
      <label>✏️ ҮЙЛДЭЛ:</label>
      <input type="text" id="node-name" placeholder="Хүүхдийн нэр...">
      <input type="number" id="node-year" placeholder="Он (1990...)" style="width: 90px;">
      <button class="btn btn-add" onclick="addChild()">+ Хүүхэд нэмэх</button>
      <button class="btn btn-edit" onclick="editNode()">Засах</button>
      <button class="btn btn-delete" onclick="deleteNode()">Устгах</button>
      <button class="btn btn-save" onclick="saveToCloud()">☁️ Cloud-д хадгалах</button>
      <button class="btn btn-pdf" onclick="exportPDF()">📄 PDF Татах</button>
    </div>
  </div>

  <!-- Мод зурах талбар -->
  <div id="tree-container"></div>
</div>

<script>
  // Supabase холболтын мэдээлэл
  const SUPABASE_URL = "https://mxo-app.supabase.co"; 
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14by1hcHAiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTczNzQ1Nzk5NiwiZXhwIjoyMDUzMDMzOTk2fQ.eyJ1c2VyIjpudWxsfQ";

  let supabaseClient = null;
  let currentUser = null;

  let treeData = {
    name: "Өвөг дээдэс",
    year: "1940",
    children: [
      { 
        name: "Аав", 
        year: "1965",
        children: [
          { name: "Би", year: "1990" },
          { name: "Дүү", year: "1995" }
        ]
      },
      { name: "Ах", year: "1968" }
    ]
  };

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        await checkUser();
      }
    } catch(e) {
      console.log("Supabase init error:", e);
    }
    renderTree(treeData);
  });

  async function checkUser() {
    if (!supabaseClient) return;
    try {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        currentUser = user;
        document.getElementById('user-status').innerText = user.email;
        document.getElementById('auth-btn').innerText = "🚪 Гарах";
      }
    } catch (err) {
      console.error(err);
    }
  }

  async function handleAuth() {
    if (!supabaseClient) {
      alert("Supabase холболтод алдаа гарлаа. Түлхүүрээ шалгана уу!");
      return;
    }

    if (currentUser) {
      await supabaseClient.auth.signOut();
      window.location.reload();
    } else {
      const email = prompt("Нэвтрэх/Бүртгүүлэх и-мэйл хаягаа оруулна уу:");
      if (email && email.trim() !== "") {
        try {
          const { error } = await supabaseClient.auth.signInWithOtp({ 
            email: email.trim(),
            options: { emailRedirectTo: window.location.href }
          });
          
          if (error) alert("Алдаа гарлаа: " + error.message);
          else alert("Таны " + email + " и-мэйл рүү нэвтрэх холбоос явууллаа. И-мэйлээ шалгаарай!");
        } catch (err) {
          alert("Холболтын алдаа: " + err.message);
        }
      }
    }
  }

  function renderTree(data) {
    const container = document.getElementById("tree-container");
    container.innerHTML = "";
    const width = container.clientWidth || 800;
    const height = 600;

    const layoutType = document.getElementById("layout-select").value;
    const fontFamily = document.getElementById("font-family") ? document.getElementById("font-family").value : 'Roboto';

    const svg = d3.select("#tree-container").append("svg")
      .attr("width", width)
      .attr("height", height);

    const root = d3.hierarchy(data);

    if (layoutType === 'radial') {
      // ТОЙРОГ ЗАГВАР (RADIAL LAYOUT)
      const radius = Math.min(width, height) / 2 - 80;
      const treeLayout = d3.tree().size([2 * Math.PI, radius]);
      treeLayout(root);

      const g = svg.append("g")
        .attr("transform", `translate(${width / 2},${height / 2})`);

      g.selectAll('.link')
        .data(root.links())
        .enter()
        .append('path')
        .attr('class', 'link')
        .attr('d', d3.linkRadial()
          .angle(d => d.x)
          .radius(d => d.y));

      const node = g.selectAll('.node')
        .data(root.descendants())
        .enter()
        .append('g')
        .attr('class', 'node')
        .attr('transform', d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`);

      node.append('rect')
        .attr('width', 110)
        .attr('height', 40)
        .attr('x', -55)
        .attr('y', -20);

      node.append('text')
        .attr('transform', d => d.x < Math.PI ? '' : 'rotate(180)')
        .text(d => `${d.data.name} (${d.data.year || ''})`)
        .style("font-family", fontFamily);

    } else {
      // БОСОО ЗАГВАРУУД (Top-Down & Bottom-Up)
      const treeLayout = d3.tree().size([width - 120, height - 120]);
      treeLayout(root);

      const g = svg.append("g")
        .attr("transform", "translate(60, 60)");

      if (layoutType === 'bottom-up') {
        root.each(d => d.y = (height - 120) - d.y);
      }

      g.selectAll('.link')
        .data(root.links())
        .enter()
        .append('path')
        .attr('class', 'link')
        .attr('d', d3.linkVertical()
          .x(d => d.x)
          .y(d => d.y));

      const node = g.selectAll('.node')
        .data(root.descendants())
        .enter()
        .append('g')
        .attr('class', 'node')
        .attr('transform', d => `translate(${d.x},${d.y})`);

      node.append('rect')
        .attr('width', 130)
        .attr('height', 45)
        .attr('x', -65)
        .attr('y', -22);

      node.append('text')
        .text(d => `${d.data.name} (${d.data.year || ''})`)
        .style("font-family", fontFamily);
    }
  }

  function updateTree() {
    renderTree(treeData);
  }

  function addChild() {
    const name = document.getElementById('node-name').value;
    const year = document.getElementById('node-year').value;
    if(!name) return alert("Нэрээ оруулна уу!");
    
    if(!treeData.children) treeData.children = [];
    treeData.children.push({ name, year });
    renderTree(treeData);
    document.getElementById('node-name').value = '';
    document.getElementById('node-year').value = '';
  }

  function editNode() { alert("Засах үйлдэл хийгдэнэ."); }
  function deleteNode() { alert("Устгах үйлдэл хийгдэнэ."); }
  function saveToCloud() { alert("Cloud хадгалах функц."); }
  function exportPDF() { alert("PDF экспортлох функц."); }
</script>

</body>
</html>
